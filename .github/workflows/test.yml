name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./components/levoit/host_test/run.sh
      - run: for f in tools/*.sh; do sh -n "$f"; done
      - run: python3 -m py_compile tools/mcu_sim.py
